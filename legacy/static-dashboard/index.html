<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Operations Center - Phishing Forensics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="min-h-screen">
  
  <nav class="glass sticky top-0 z-50 p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-3xl">🛡️</span>
        <h1 class="text-xl font-bold tracking-wide">Phishing Forensics <span class="text-blue-400">SOC</span></h1>
      </div>
      <div>
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">Admin Login</button>
        <button id="logout-btn" class="hidden bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg font-medium transition-colors">Logout</button>
      </div>
    </div>
  </nav>

  <!-- Login Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="glass p-8 rounded-2xl w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center">Admin Access</h2>
      <div class="flex flex-col gap-4">
        <input type="email" id="email" placeholder="Admin Email" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-lg text-white focus:outline-none focus:border-blue-500">
        <input type="password" id="password" placeholder="Password" class="w-full bg-slate-800 border border-slate-600 p-3 rounded-lg text-white focus:outline-none focus:border-blue-500">
        <button id="submit-login" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-lg font-bold mt-2">Login to SOC</button>
        <p id="auth-error" class="text-red-400 text-sm text-center"></p>
      </div>
    </div>
  </div>

  <!-- Dashboard Content -->
  <main id="dashboard-content" class="container mx-auto p-6 hidden">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="glass p-6 rounded-2xl border-l-4 border-blue-500">
        <h3 class="text-slate-400 font-medium mb-1">Total Scans</h3>
        <p id="stat-total" class="text-4xl font-bold">0</p>
      </div>
      <div class="glass p-6 rounded-2xl border-l-4 border-red-500">
        <h3 class="text-slate-400 font-medium mb-1">Threats Blocked</h3>
        <p id="stat-threats" class="text-4xl font-bold text-red-400">0</p>
      </div>
      <div class="glass p-6 rounded-2xl border-l-4 border-green-500">
        <h3 class="text-slate-400 font-medium mb-1">Safe Emails</h3>
        <p id="stat-safe" class="text-4xl font-bold text-green-400">0</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <div class="lg:col-span-2 glass rounded-2xl overflow-hidden">
        <div class="p-4 border-b border-slate-700 bg-slate-800/50">
          <h2 class="text-lg font-semibold">Live Threat Feed</h2>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-800 text-slate-400 text-sm">
                <th class="p-4 font-medium">Time</th>
                <th class="p-4 font-medium">Sender</th>
                <th class="p-4 font-medium">Risk</th>
                <th class="p-4 font-medium">Score</th>
                <th class="p-4 font-medium">Verdict</th>
              </tr>
            </thead>
            <tbody id="threat-table" class="divide-y divide-slate-700">
              <!-- JS Populated -->
            </tbody>
          </table>
        </div>
      </div>

      <div class="glass rounded-2xl p-6 flex flex-col items-center">
        <h2 class="text-lg font-semibold mb-4 self-start">Risk Distribution</h2>
        <div class="w-full max-w-[250px]">
          <canvas id="riskChart"></canvas>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
