<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forensics History</title>
  <link rel="stylesheet" href="dashboard.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">
    <header>
      <div class="header-brand">
        <span class="shield">🛡️</span>
        <h1>Analysis History</h1>
      </div>
      <button id="logout-btn" class="btn-outline">Logout</button>
    </header>

    <main>
      <div id="loading" class="loading">Fetching History...</div>
      
      <div id="history-list" class="grid-layout hidden">
        <!-- History items injected here -->
      </div>
      
      <div id="no-data" class="hidden empty-state">
        <p>No past analysis records found.</p>
      </div>
    </main>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>
