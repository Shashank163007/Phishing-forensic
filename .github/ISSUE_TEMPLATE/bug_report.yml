name: Bug report
description: Report a reproducible problem with the project.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include real email contents, personal information, credentials, API keys, or other sensitive data. For security vulnerabilities, use the private reporting process in [SECURITY.md](https://github.com/Shashank163007/Phishing-forensic/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Backend
        - Chrome extension
        - Dashboard
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest safe, reproducible sequence.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant logs
      description: Include relevant versions and redacted logs. Remove secrets and user data.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and security
      options:
        - label: I removed real email content, personal information, credentials, API keys, and other sensitive data.
          required: true
