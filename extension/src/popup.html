<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phishing Forensics AI</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .history-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      border-left: 4px solid #10b981;
      text-align: left;
    }
    .history-card.danger { border-left-color: #ef4444; }
    .history-card.warning { border-left-color: #f59e0b; }
    .history-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .history-verdict { font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .history-findings { font-size: 11px; color: #cbd5e1; list-style-type: disc; padding-left: 16px; margin: 0; }
    .scan-status {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      color: #10b981;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .history-list {
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }
  </style>
</head>
<body>
  <div id="app" class="app-container">
    
    <!-- Auth Screen -->
    <div id="auth-view" class="view">
      <div class="logo-area">
        <div class="shield-icon">🛡️</div>
        <h1>Phishing Forensics</h1>
        <p class="subtitle">AI-Powered Email Security</p>
      </div>

      <div class="tabs">
        <button id="tab-login" class="tab active">Login</button>
        <button id="tab-signup" class="tab">Sign Up</button>
      </div>

      <div class="form-group" id="signup-fields" style="display: none; margin-bottom: 10px;">
        <input type="text" id="fullname" placeholder="Full Name" />
        <input type="text" id="organization" placeholder="Organization Name" />
        <select id="role" style="width: 100%; padding: 12px; margin-top: 10px; background: #1e293b; border: 1px solid #334155; color: #fff; border-radius: 8px;">
          <option value="" disabled selected>Select Your Role</option>
          <option value="Employee">Employee</option>
          <option value="IT Admin">IT Admin</option>
          <option value="Security Analyst">Security Analyst</option>
        </select>
      </div>

      <div class="form-group">
        <input type="email" id="email" placeholder="Email Address" required />
        <input type="password" id="password" placeholder="Password" required />
        <div class="consent-box" id="consent-container" style="display: none;">
          <input type="checkbox" id="consent" />
          <label for="consent">I accept the Terms & Conditions</label>
        </div>
        <button id="auth-btn" class="btn-primary">Authenticate</button>
        
        <div id="auth-error" class="error-msg"></div>
      </div>
    </div>

    <!-- Main Extension Screen -->
    <div id="sandbox-view" class="view hidden">
      <header>
        <div class="header-left">
          <span class="shield-small">🛡️</span>
          <h2>Forensic Scanner</h2>
        </div>
        <button id="logout-btn" class="btn-icon" title="Logout">🚪</button>
      </header>

      <div class="content">
        <div class="scan-status">
          <span>⚡</span>
          <span><strong>AI is active.</strong> Open emails in Gmail to automatically scan them.</span>
        </div>

        <h3 style="margin-bottom: 12px; font-size: 14px; color: #f8fafc;">Recent Scans</h3>
        <div id="history-container" class="history-list">
          <p style="color: #64748b; font-size: 12px; text-align: center; margin-top: 20px;">Loading history...</p>
        </div>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
